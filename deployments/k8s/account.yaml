# account：无状态 HTTP 服务。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account
  namespace: linkim
spec:
  replicas: 2
  selector:
    matchLabels: { app: account }
  template:
    metadata:
      labels: { app: account }
    spec:
      containers:
        - name: account
          image: linkim/account:latest
          args: ["-conf", "/etc/linkim/account.yaml"]
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: config, mountPath: /etc/linkim }
          readinessProbe:
            httpGet: { path: /metrics, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config
          configMap: { name: linkim-config }
---
apiVersion: v1
kind: Service
metadata:
  name: account
  namespace: linkim
spec:
  selector: { app: account }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
