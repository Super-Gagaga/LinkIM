# LinkIM account service (HTTP + JWT)
server:
  name: account
  http_port: 8080

mysql:
  dsn: "root:linkim123@tcp(127.0.0.1:3307)/linkim?charset=utf8mb4&parseTime=true&loc=Local"
  max_open_conns: 64
  max_idle_conns: 16
  conn_max_lifetime: 5m

redis:
  addr: "127.0.0.1:16379"
  password: ""
  db: 0

kafka:
  brokers:
    - "127.0.0.1:9092"
  client_id: "account"

log:
  level: debug
  format: console
