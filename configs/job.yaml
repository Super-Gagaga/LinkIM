# LinkIM job service (Kafka consumer, no listener of its own)
server:
  name: job

mysql:
  dsn: "root:linkim123@tcp(127.0.0.1:23306)/linkim?charset=utf8mb4&parseTime=true&loc=Local"
  max_open_conns: 64
  max_idle_conns: 16
  conn_max_lifetime: 5m

redis:
  addr: "127.0.0.1:16379"
  password: ""
  db: 0

kafka:
  brokers:
    - "127.0.0.1:9092"
  client_id: "job"

log:
  level: debug
  format: console

consumer:
  push_group: "job-push"
  store_group: "job-store"
  min_bytes: 1
  max_bytes: 1048576
  read_backoff_max: 2s
