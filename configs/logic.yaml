# LinkIM logic service (gRPC :9001)
server:
  name: logic
  grpc_port: 9001
  metrics_port: 9091

mysql:
  dsn: "root:linkim123@tcp(127.0.0.1:23306)/linkim?charset=utf8mb4&parseTime=true&loc=Local"
  max_open_conns: 64
  max_idle_conns: 16
  conn_max_lifetime: 5m

redis:
  addr: "127.0.0.1:16379"
  password: ""
  db: 0

kafka:
  brokers:
    - "127.0.0.1:9092"
  client_id: "logic"

log:
  level: debug
  format: console

account:
  addr: "http://127.0.0.1:8080"
  verify_timeout: 1s
